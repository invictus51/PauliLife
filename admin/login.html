<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso administrativo | PauliLife</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="auth-body admin-auth-body">
    <a class="auth-brand" href="../index.html">
        🍃 <strong>PauliLife</strong>
    </a>
    <main class="auth-shell">
        <section class="auth-card">
    
            <a class="back-link" href="../index.html">
                ← Voltar ao site público
            </a>
            <span class="eyebrow">
                ÁREA RESTRITA
            </span>

            <h1>Painel da administração</h1>

            <p>
                Entre com o e-mail e a senha do ADM.
            </p>

            <form id="admin-login-form">
                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    required
                >
                <label for="password">
                    Senha
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
                <button
                    class="btn btn-primary btn-full"
                    type="submit"
                    id="admin-login-submit"
                >
                    Acessar painel
                </button>
                <div
                    class="message"
                    id="auth-message"
                    role="status"
                ></div>

            </form>
            <p class="auth-legal">
                Não existe cadastro público de administradores.
            </p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
