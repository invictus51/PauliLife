<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | PauliLife</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">
    <a class="auth-brand" href="index.html">
        🍃 <strong>PauliLife</strong>
    </a>
    <main class="auth-shell">

        <section class="auth-card">
            <a class="back-link" href="index.html">
                ← Retornar ao site
            </a>
            <span class="eyebrow">
                BEM-VINDO DE VOLTA
            </span>

            <h1>Entrar na sua conta</h1>

            <p>
                Utilize o sue e-mail e a sua senha cadastrados préviamente.
            </p>
            <form id="login-form">
                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >
                <label for="password">
                    Senha
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
                <button
                    class="btn btn-primary btn-full"
                    type="submit"
                    id="login-submit"
                >
                    Entrar
                </button>
                <div
                    class="message"
                    id="auth-message"
                    role="status"
                ></div>

            </form>
            <p class="auth-switch">
                Ainda não tem conta?
                <a href="cadastro.html">Criar conta</a>
            </p>

            <p class="auth-legal">
                Guarde sua senha em local seguro.
            </p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
