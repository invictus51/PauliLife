
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.1">

    <title>Criar conta | PauliLife</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-body">
    <a class="auth-brand" href="index.html">
        🍃 Eco<strong>Paulínia</strong>
    </a>
    <main class="auth-shell">

        <section class="auth-card">
            <a class="back-link" href="index.html">
                ← Voltar ao site
            </a>
            <span class="eyebrow">
                PARTICIPE DA COMUNIDADE
            </span>
            <h1>Crie sua conta</h1>
            <p>
                Informe seus dados para poder fazer sua denuncia.
            </p>
            <form id="cadastro-form">
                <label for="full-name">
                    Nome
                </label>

                <input
                    id="full-name"
                    name="full_name"
                    type="text"
                    minlength="2"
                    maxlength="100"
                    autocomplete="name"
                    placeholder="Seu nome"
                    required
                >
                <label for="email">
                    E-mail
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    maxlength="250"
                    placeholder="1234@exemplo.com"
                    required
                >
                <label for="password">
                    Senha
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="5"
                    autocomplete="new-password"
                    placeholder="Pelo menos 5 caracteres"
                    required
                >
                <label for="password-confirm">
                    Confirme a senha
                </label>

                <input
                    id="password-confirm"
                    name="password-confirm"
                    type="password"
                    minlength="5"
                    autocomplete="new-password"
                    placeholder="Digite a senha novamente"
                    required
                >
                <button
                    class="btn btn-primary btn-full"
                    type="submit"
                    id="cadastro-submit"
                >
                    Criar conta
                </button>
                <div
                    class="message"
                    id="auth-message"
                    role="status"
                ></div>

            </form>
            <p class="auth-switch">
                Já tem uma conta?
                <a href="login.html">Entrar</a>
            </p>
            <p class="auth-legal">
                Seu e-mail não será mostrado.
                O cadastro não exige confirmação de e-mail; por isso, confira se digitou o endereço corretamente.
            </p>

        </section>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
